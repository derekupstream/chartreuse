name: Prisma Database Workflow
on:
  push:
    branches: [main]
    paths: ['prisma/**']
  pull_request:
    branches: [main]
    paths: ['prisma/**']
  workflow_dispatch:

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Client
        run: npx prisma generate

  migrate-prod:
    # Apply any pending prisma migrations to production Supabase whenever
    # main is updated with prisma/** changes (or manually via workflow_dispatch).
    # Uses `prisma migrate deploy` — additive only, never destructive.
    runs-on: ubuntu-latest
    needs: validate-schema
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: prisma-migrate-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Apply pending migrations to Supabase prod
        env:
          # Must point at Supabase session pooler (port 5432) — the transaction
          # pooler on 6543 doesn't support DDL needed for migrations.
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy
